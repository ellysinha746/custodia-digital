# Sprint 8 (historia 37): integración continua de CustodiaDigital.
# Se ejecuta en cada push y en cada pull request a main. Si algo falla, el PR queda en rojo
# y no se debe hacer merge hasta corregirlo.
name: CI

on:
  push:
    branches: [main, "sprint*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · migraciones y pruebas
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: custodia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Base de PRUEBAS dentro del runner y claves falsas: nunca datos ni claves reales.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/custodia_test
      SECRET_KEY: clave-falsa-solo-para-ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Aplicar todas las migraciones (la cadena de Alembic no está rota)
        run: alembic upgrade head
      - name: Pruebas automáticas
        run: pytest -v

  frontend:
    name: Frontend · lint y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Revisión de código (ESLint)
        run: npm run lint
      - name: Compilar
        run: npm run build

  secretos:
    name: Seguridad · secretos filtrados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # revisa TODO el historial, no solo el último commit
      - name: Buscar claves o tokens en el repositorio (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker · la imagen del backend se construye
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen (sin publicarla)
        run: docker build -t custodia-api:ci backend
